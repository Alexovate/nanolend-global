[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.21"
optimizer = true
optimizer_runs = 200
evm_version = "paris"

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true

[fuzz]
runs = 256

[dependencies]
openzeppelin-contracts = "https://github.com/OpenZeppelin/openzeppelin-contracts"
forge-std = "https://github.com/foundry-rs/forge-std"

# RPC URLs for multi-chain deployment
[rpc_endpoints]
world_chain = "${WORLD_CHAIN_RPC_URL}"
base = "${BASE_RPC_URL}"  
arbitrum = "${ARBITRUM_RPC_URL}"
